    .blog-body { padding:20px;flex:1;display:flex;flex-direction:column; }

    .btn-read-more { display:inline-block;background:#ff6633;color:#fff !important;font-weight:600;font-size:13px;padding:10px 20px;border-radius:6px;text-decoration:none !important;transition:background 0.3s;align-self:flex-start; }

<script>
function renderBlogs() {
    var grid = document.getElementById("blogs-grid");
    if (!grid || !window.PPH_BLOGS) return;
    var html = "";
    PPH_BLOGS.forEach(function(blog) {
        html += "<div class='col-12 col-sm-6 col-lg-4'>" +
            "<div class='blog-card'>" +
            "<div class='blog-img-wrap'><img src='" + blog.image + "' alt='" + blog.title + "'></div>" +
            "<div class='blog-body'>" +
            "<span class='blog-category'>" + blog.category + "</span>" +
            "<p class='blog-date'>" + blog.date + "</p>" +
            "<h3>" + blog.title + "</h3>" +
            "<p>" + blog.excerpt + "</p>" +
            "<a href='blog-post.html?post=" + blog.slug + "' class='btn-read-more'>Read More →</a>" +
            "</div></div></div>";
    });
    grid.innerHTML = html;
}
renderBlogs();

<!-- pph-mobile-toggle-fallback -->
<script>
(function(){
  function q(s){return document.querySelector(s);}
  function openMenu(){
    var m=document.getElementById('mobile-menu');
    if(m){m.classList.remove('invisible');m.classList.add('active','visible');}
    var b=q('.bg-screen .bg-back');
    if(b){b.classList.remove('opacity-0','invisible');b.classList.add('opacity-50','visible');}
  }
  function closeMenu(){
    var m=document.getElementById('mobile-menu');
    if(m){m.classList.add('invisible');m.classList.remove('active','visible');}
    var b=q('.bg-screen .bg-back');
    if(b){b.classList.add('opacity-0','invisible');b.classList.remove('opacity-50','visible');}
  }
  document.addEventListener('click', function(e){
    var t=e.target;
    if(!t || !t.closest) return;
    if(t.closest('a.toggler-btn')){ e.preventDefault(); openMenu(); }
    else if(t.closest('.menu-close-btn') || t.closest('.bg-back')){ closeMenu(); }
  }, false);
})();
</script>
<!-- /pph-mobile-toggle-fallback -->
